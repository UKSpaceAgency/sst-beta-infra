name: E2E fixtures tests
on:
  pull_request:
    paths:
      - aws/e2e_tests/**
      - .github/workflows/e2e-fixtures-tests.yml

jobs:
  test:
    name: Test prepare_fixtures.py
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run tests
        run: uv run --python 3.12 --with pytest --with pytest-mock pytest aws/e2e_tests
